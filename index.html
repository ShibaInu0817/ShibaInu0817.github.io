<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tee Tian Xiang · Backend Engineer</title>
<meta name="description" content="Tee Tian Xiang (ShibaInu0817), backend engineer. Experience, case studies, tools and skills.">
<meta name="theme-color" content="#121815">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121815'/%3E%3Cg fill='none' stroke-width='6' stroke-linecap='round'%3E%3Cpath stroke='%23fff' d='M18 22h28M18 42h28'/%3E%3Cpath stroke='%2319a37f' d='M18 32h18'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a portfolio read one screen at a time. The dark cover drops away like a
   curtain, then each scroll step slides in one full page (about, case studies, games,
   tools, skills, contact) whose contents arrive in sequence. One accent, plain type. */
:root{
  color-scheme:light;
  --paper:#f5f6f3;
  --card:#ffffff;
  --ink:#121815;
  --dim:#626a66;
  --line:#dfe2dc;
  --accent:#0d7a5f;
  --accent-soft:#e2f2ec;
  --mint:#5fd0b1;       /* accent on dark */
  --sans:"Instrument Sans","Noto Sans SC",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --gutter:clamp(18px,4.5vw,64px);
  --ease:cubic-bezier(.22,.61,.36,1);
  --page:cubic-bezier(.77,0,.18,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
img,video{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.on-dark :focus-visible,.cover :focus-visible{outline-color:#fff}
h1,h2,h3{font-weight:500;letter-spacing:-.035em;margin:0}
:lang(zh) h1,:lang(zh) h2,:lang(zh) h3{letter-spacing:-.01em}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 var(--gutter)}

/* header + page rail */
.bar{position:fixed;inset:0 0 auto 0;z-index:40;color:var(--ink);transition:color .5s}
.bar .wrap{display:flex;align-items:center;gap:8px 24px;height:64px;max-width:none}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:600;letter-spacing:-.02em;margin-right:auto}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--ink);display:grid;place-items:center;transition:background .5s}
.brand i::before{content:"";width:11px;height:9px;border-block:2px solid #fff;background:linear-gradient(#19a37f,#19a37f) left center/7px 2px no-repeat}
.links{display:flex;gap:22px}
.links a{text-decoration:none;font-size:14px;font-weight:500;opacity:.6;padding:6px 0;transition:opacity .2s}
.links a:hover,.links a.on{opacity:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;transition:border-color .5s}
.seg button{border:0;background:none;padding:5px 9px;font-size:12px;font-weight:500;opacity:.65}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;opacity:1}
.email{border:1px solid var(--line);border-radius:8px;background:none;padding:5px 11px;font-size:13px;font-weight:500;transition:border-color .2s}
.email i{font-style:normal}
.email:hover{border-color:currentColor}
.on-dark .email{border-color:rgba(255,255,255,.28)}
.email{color:inherit;text-decoration:none}
.on-dark .bar{color:#fff}
.on-dark .brand i{background:#2b3631}
.on-dark .seg{border-color:rgba(255,255,255,.28)}
.on-dark .seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.rail{position:fixed;z-index:40;right:clamp(10px,1.6vw,24px);top:50%;translate:0 -50%;display:none;flex-direction:column;gap:2px;color:var(--ink);transition:color .5s}
.on-dark .rail{color:#fff}
.rail button{display:flex;align-items:center;justify-content:flex-end;gap:10px;border:0;background:none;padding:6px 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;opacity:.45;transition:opacity .25s}
.rail button{position:relative}
.rail button span{position:absolute;right:calc(100% + 10px);top:50%;margin-top:-.75em;opacity:0;translate:6px 0;transition:opacity .25s,translate .25s;white-space:nowrap;pointer-events:none;background:var(--paper);color:var(--ink);padding:1px 7px;border-radius:5px;box-shadow:0 0 0 1px var(--line)}
.rail button::after{content:"";width:14px;height:2px;border-radius:2px;background:currentColor;transition:width .35s var(--ease),background .35s}
.rail button:hover,.rail button.on{opacity:1}
.rail button:hover span,.rail button:focus-visible span{opacity:1;translate:0 0}
.rail button.on::after{width:28px;background:#19a37f}

/* buttons, tags */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);border-radius:10px;padding:10px 17px;font-size:14.5px;font-weight:500;text-decoration:none;background:var(--ink);color:#fff;transition:translate .2s var(--ease),background .2s,border-color .2s}
.btn:hover{background:#26302b;translate:0 -1px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);background:transparent}
.dark .btn{background:#fff;color:var(--ink);border-color:#fff}
.dark .btn:hover{background:#e8ebe6}
.dark .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.dark .btn.ghost:hover{border-color:#fff;background:transparent}
.sm{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:500;text-decoration:none}
.sm:hover{border-color:var(--ink)}
.sm.main{background:var(--accent);border-color:var(--accent);color:#fff}
.sm.main:hover{background:#0a6851;border-color:#0a6851}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 7px;background:#eceee9;color:var(--dim);white-space:nowrap}

/* pages: natural flow by default; html.paged turns them into full screens */
.cover{position:relative;min-height:100svh;background:var(--ink);color:#fff;overflow:hidden;display:flex;flex-direction:column}
.cover::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 55% at 78% 8%,rgba(25,163,127,.22),transparent 70%);pointer-events:none}
.page{position:relative;background:var(--paper)}
.page.dark{background:var(--ink);color:#fff}
.page + .page{border-top:1px solid var(--line)}
.pg{padding:clamp(64px,10vw,110px) 0}
.pg>.wrap{margin-block:auto}
html:not(.paged) .bar{position:absolute}
.paged body{overflow:hidden}
.paged .cover{position:fixed;inset:0;z-index:20;min-height:0;height:100%;transition:transform 1100ms cubic-bezier(.7,0,.2,1),box-shadow 1100ms;box-shadow:0 24px 60px rgba(8,20,15,.35);will-change:transform}
.paged .cover.away{transform:translateY(102%)}
.paged #pages{position:fixed;inset:0;z-index:1;transition:transform 1000ms var(--page);will-change:transform}
.paged .page{height:100vh;border:0}
.paged .pg{height:100%;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;padding:78px 0 34px;scrollbar-width:thin}
.paged .rail{display:flex}
.paged .pg>.wrap{padding-right:max(var(--gutter),84px)}

/* entrance: contents arrive in sequence the first time a page is reached */
[data-a]{--d:0}
.stage:not(.in) [data-a]{opacity:0;transform:translateY(28px)}
.stage.in [data-a]{transition:opacity .8s var(--ease),transform .8s var(--ease),translate .35s var(--ease);transition-delay:calc(var(--d)*85ms + var(--base,0ms)),calc(var(--d)*85ms + var(--base,0ms)),0s}
.stage:not(.in) .w{opacity:0;transform:translateY(.7em) rotateX(-55deg);filter:blur(10px)}
.w{display:inline-block;transform-origin:50% 100%}
.stage.in .w{transition:opacity .7s var(--ease),transform .7s var(--ease),filter .7s var(--ease);transition-delay:calc(var(--i)*38ms + var(--base,0ms))}
.stage:not(.in) .clip{clip-path:inset(0 0 100% 0)}
.stage:not(.in) .clip img{transform:scale(1.12)}
.clip{clip-path:inset(0)}
.stage.in .clip{transition:clip-path 1.1s var(--page);transition-delay:calc(var(--d)*85ms + var(--base,0ms))}
.stage.in .clip img{transition:transform 1.4s var(--ease);transition-delay:calc(var(--d)*85ms + var(--base,0ms))}
.stage.now [data-a],.stage.now .w,.stage.now .clip,.stage.now .clip img{transition:none!important}

/* cover */
.cover .inner{position:relative;flex:1;display:flex;align-items:center;padding:84px 0 0}
.hint{bottom:14px}
.who{display:flex;align-items:center;gap:10px;font-size:15px;color:rgba(255,255,255,.75)}
.who b{color:#fff;font-weight:600}
.who i{width:8px;height:8px;border-radius:50%;background:#19a37f;box-shadow:0 0 0 4px rgba(25,163,127,.25)}
.cover .hi{margin:20px 0 0;font-size:clamp(19px,2.1vw,30px);font-weight:500;letter-spacing:-.025em;color:rgba(255,255,255,.72)}
.cover h1{font-size:clamp(30px,4vw,60px);line-height:1.06;letter-spacing:-.045em;max-width:21em;margin-top:8px;perspective:800px;text-wrap:balance}
.cover h1 .num{display:inline-block;font-variant-numeric:tabular-nums;white-space:nowrap}
.cover h1 em{font-style:normal;color:var(--mint)}
:lang(zh) .cover h1{font-size:clamp(28px,3.9vw,56px);line-height:1.22}
.cover .sub{margin:20px 0 0;max-width:54ch;font-size:clamp(15.5px,1.3vw,18px);color:rgba(255,255,255,.72)}
.cover .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.peek{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,1.2vw,16px);margin:clamp(20px,4vh,48px) auto -3%;padding:0 var(--gutter);width:100%;max-width:1200px;flex:none}
.peek button{border:0;padding:0;border-radius:12px 12px 0 0;overflow:hidden;aspect-ratio:16/12;background:#121815;box-shadow:0 -10px 40px rgba(0,0,0,.35);transition:translate .35s var(--ease)}
.peek button:hover,.peek button:focus-visible{translate:0 -10px}
.peek img{width:100%;height:100%;object-fit:cover;object-position:top}
.hint{position:absolute;left:50%;bottom:16px;translate:-50% 0;z-index:2;display:none;align-items:center;gap:8px;border:0;border-radius:99px;background:rgba(18,24,21,.72);backdrop-filter:blur(8px);color:#fff;padding:7px 14px;font-family:var(--mono);font-size:11px;letter-spacing:.08em}
.hint i{width:1px;height:16px;background:linear-gradient(#19a37f 50%,rgba(255,255,255,.3) 50%) 0 0/100% 200%;animation:cue 1.8s ease-in-out infinite}
.paged .hint{display:inline-flex}
@keyframes cue{from{background-position:0 100%}to{background-position:0 -100%}}

/* shared page type */
.page h2{font-size:clamp(28px,3.6vw,48px);line-height:1.06;max-width:17em;margin-top:10px;perspective:800px}
.lead{color:var(--dim);font-size:17px;max-width:56ch;margin:14px 0 0}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,6vw,96px);align-items:start}
.about p{margin:16px 0 0;color:var(--dim);font-size:17px;max-width:52ch}
.xp{display:grid;border-top:1px solid var(--ink)}
.xp article{display:grid;grid-template-columns:92px minmax(0,1fr);gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.xp .when{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding-top:5px}
.xp h3{font-size:21px}
.xp h3 span{color:var(--dim);font-weight:400;letter-spacing:-.01em;font-size:16px;margin-left:8px}
.xp p{margin:6px 0 0;font-size:15px;max-width:none}
.xp .edu{margin:16px 0 0;font-size:14px;color:var(--dim)}
.xp .edu b{display:block;font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:clamp(28px,5vh,56px);padding-top:18px;border-top:1px solid var(--line)}
.nums dt{font-size:clamp(34px,4.4vw,58px);font-weight:500;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.nums dd{margin:6px 0 0;color:var(--dim);font-size:14px;max-width:26ch}

/* case study page */
.case{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:clamp(24px,4.5vw,72px);align-items:center}
.case.flip .media{order:2}
.media{position:relative}
.media .clip{display:block;width:100%;border:0;padding:0;border-radius:16px;overflow:hidden;aspect-ratio:16/10;background:#121815;box-shadow:0 30px 60px -34px rgba(18,24,21,.55)}
.media img{width:100%;height:100%;object-fit:contain}
.media .more{display:flex;gap:8px;margin-top:10px}
.media .more button{flex:0 0 calc(25% - 6px);border:0;padding:0;border-radius:8px;overflow:hidden;aspect-ratio:16/10;background:#121815;opacity:.8}
.media .more button:hover{opacity:1}
.media .more img{object-fit:cover}
.case h2{font-size:clamp(28px,3.4vw,46px)}
.case .ov{margin:12px 0 0;color:var(--dim);font-size:16px;max-width:52ch}
.pts{margin:16px 0 0;padding:0;list-style:none;counter-reset:n;display:grid;gap:9px;border-top:1px solid var(--line);padding-top:14px}
.pts li{counter-increment:n;display:grid;grid-template-columns:30px 1fr;font-size:14.5px;line-height:1.45}
.pts li::before{content:counter(n,decimal-leading-zero);font-family:var(--mono);font-size:11.5px;color:var(--accent);padding-top:2px}
.res{margin:14px 0 0;padding:11px 14px;border-radius:10px;background:var(--accent-soft);color:#0a4d3c;font-size:14.5px;font-weight:500}
.tokens{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tokens span{border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-family:var(--mono);font-size:11.5px;background:var(--card)}
.case .acts{margin-top:18px;padding:0}

.rows{margin:14px 0 0;display:grid;gap:9px;border-top:1px solid var(--line);padding-top:13px}
.rows div{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;font-size:14.5px;line-height:1.45}
.rows dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding-top:3px}
.rows dd{margin:0}
@media(max-width:520px){.rows div{grid-template-columns:1fr;gap:2px}}

/* card pages */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.cards{display:grid;gap:clamp(12px,1.6vw,22px);margin-top:clamp(20px,3.4vh,36px);grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);display:flex;flex-direction:column}
.card .lift{display:flex;flex-direction:column;flex:1;transition:translate .3s var(--ease)}
.card:hover{box-shadow:0 22px 44px -26px rgba(18,24,21,.45)}
.shot{position:relative;display:block;width:100%;border:0;padding:0;aspect-ratio:16/10;background:#121815;overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;transition:scale .6s var(--ease)}
.card:hover .shot img{scale:1.04}
.shot.fit img{object-fit:contain}
.shot .tag{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.94);color:var(--ink)}
.card .txt{padding:15px 17px 17px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:21px;line-height:1.15}
.card p{margin:0;color:var(--dim);font-size:14.5px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:12px}

/* skills */
.groups{display:grid;gap:clamp(12px,2.4vh,26px) clamp(24px,4vw,56px);grid-template-columns:repeat(3,minmax(0,1fr));margin-top:clamp(14px,2.6vh,30px)}
.group h3{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;color:var(--accent);padding-bottom:9px;border-bottom:1px solid var(--ink)}
.group ul{margin:0;padding:0;list-style:none}
.group li{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:500}
.group li small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--dim)}
.used{display:inline-flex;gap:4px;margin-left:auto}
.used button{border:0;background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:1px 6px;font-family:var(--mono);font-size:10px}
.used button:hover{background:var(--accent);color:#fff}

/* about: an orbit of what I work on, around my picture */
.orbit{display:grid;gap:20px;justify-items:center;padding:0 var(--gutter)}
.orbit .stagebox2{position:relative;order:2;width:min(100%,520px);aspect-ratio:1;container-type:inline-size;--tw:21%}
.paged .orbit{display:block;position:relative;flex:1;min-height:0;width:100%;padding:0}
.paged .orbit .stagebox2{position:absolute;left:50%;top:50%;width:min(74vh,640px,58vw);translate:-50% -52%;--tw:17.5%}
.orbit .ring{position:absolute;inset:0}
.tile{position:absolute;left:50%;top:50%;width:var(--tw);aspect-ratio:1;border:0;background:none;padding:0;display:grid;place-items:center;color:var(--t,#fff);will-change:transform}
.tile::before{content:"";position:absolute;inset:0;border-radius:30%;background:var(--c,#121815);rotate:var(--rot,0deg);box-shadow:0 18px 34px -14px rgba(18,24,21,.45),inset 0 0 0 1px rgba(18,24,21,.08);transition:scale .3s var(--ease),box-shadow .3s}
.tile span{position:relative;max-width:84%;font-size:clamp(9.5px,2.5cqw,14px);font-weight:600;letter-spacing:-.02em;line-height:1.12;text-align:center;text-wrap:balance;overflow-wrap:anywhere}
.tile.has-logo{align-content:center;gap:6%}
.tile.has-logo img{position:relative;width:42%;aspect-ratio:1;object-fit:contain}
.tile.has-logo span{font-size:clamp(8.5px,2.1cqw,12.5px)}
.tile:hover::before,.tile:focus-visible::before,.tile.pin::before{scale:1.1;box-shadow:0 24px 44px -14px rgba(18,24,21,.55),inset 0 0 0 2px var(--accent)}
.tile:focus-visible{outline:none}
.core{position:absolute;left:50%;top:50%;translate:-50% -50%;display:grid;justify-items:center;gap:10px;text-align:center;pointer-events:none;width:46%}
.core img{width:clamp(64px,19cqw,124px);aspect-ratio:1;object-fit:cover;border-radius:28%;box-shadow:0 22px 40px -16px rgba(18,24,21,.6)}
.core b{font-size:clamp(15px,4cqw,24px);font-weight:500;letter-spacing:-.03em;line-height:1.1}
.core small{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.orbit .title{order:1;justify-self:start}
.paged .orbit .title{position:absolute;left:var(--gutter);bottom:0;max-width:26vw}
.paged .orbit .title h2{font-size:clamp(26px,3.4vw,46px)}
.orbit .title p{margin:10px 0 0;color:var(--dim);font-size:15.5px;max-width:34ch}
.pills{order:3;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.paged .pills{position:absolute;right:calc(var(--gutter) + 44px);top:50%;translate:0 -50%;flex-direction:column;flex-wrap:nowrap;align-items:flex-end}
.pills button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-size:14.5px;font-weight:500;white-space:nowrap;transform-origin:100% 50%;transition:opacity .35s,scale .35s var(--ease),background .25s,color .25s,border-color .25s}
.paged .pills button{opacity:calc(1 - var(--far,0)*.22);scale:calc(1 - var(--far,0)*.04)}
.pills button:hover{border-color:var(--ink)}
.paged .pills button:hover,.paged .pills button[aria-pressed="true"]{opacity:1}
.pills button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.info{order:4;width:min(100%,520px);border:1px solid var(--line);background:var(--card);border-radius:16px;padding:13px 16px;min-height:86px}
.paged .info{position:absolute;right:calc(var(--gutter) + 44px);bottom:0;width:min(320px,26vw)}
.info b{display:block;font-weight:500;font-size:17px;letter-spacing:-.02em}
.info b small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--dim);margin-left:8px}
.info p{margin:3px 0 0;color:var(--dim);font-size:13.5px;line-height:1.45}
.info .used,.info .sm{margin:8px 0 0}
.group .used{margin-left:auto}

.orbit .lines{display:none}

    { h: { en: "How it works", zh: "工作原理" }, p: [
      { en: "I was part of the design from the first requirement to the final architecture, and I built all of it. To set up the repo for microservices, I studied the popular public Nx + NestJS monorepos and adapted their structure. The design comes down to four ideas.", zh: "我从最初的需求到最终的架构全程参与设计，并实现了全部内容。为了把仓库搭建成微服务结构，我研究了主流的公开 Nx + NestJS 单仓库项目，并借鉴了它们的结构。整个设计可以归结为四个要点。" } ],

        { en: "<b>A channel-neutral core.</b> The core never needs to know which channel a message came from. Each channel plugs in through its own adapter, so adding one doesn't change the core.", zh: "<b>与渠道无关的核心。</b>核心不需要知道消息来自哪个渠道。每个渠道通过自己的适配器接入，新增渠道不需要改动核心。" },

    { h: { en: "What went wrong", zh: "踩过的坑" }, p: [

function startTpl(root) {

  const cp = $$(".b .tpl-f"), own = $$(".own .tpl-f"), oks = $$(".tpl-e2e span");
  const [footB, footA] = $$(".tpl-foot"), [gShared, gOwn, gE2e] = $$(".tpl-grp");
  const on = (el, c = "on") => () => el.classList.add(c);
  const steps = [
    ...cp.map(el => [on(el), 130]), [() => {}, 350],
    ...cp.map(el => [on(el, "chg"), 150]), [on(footB), 1100],
    [on(gShared), 650], [on(gOwn), 200],
    ...own.map(el => [() => el.classList.add("on", "rev"), 320]), [on(gE2e), 300],
    ...oks.map(el => [on(el, "ok"), 330]), [on(footA), 3600],

  if (calm.matches) { full(); return; }
  let visible = false, timer = 0, i = 0;
  const io = new IntersectionObserver(es => { visible = es.some(e => e.isIntersecting); if (visible && !timer) tick(); }, { threshold: .2 });
  io.observe(root);

    timer = 0;

}

const seen = new Set();
const stageOf = i => i === 0 ? cover : pagesEl.children[i - 1];
function arrive(i, quiet) {
  const el = stageOf(i); if (!el) return;
  const id = PAGES[i].id, firstTime = !seen.has(id);

  requestAnimationFrame(() => { el.classList.add("in"); if (firstTime && !quiet) el.classList.remove("now"); });

      </div>
      ${p.code === "WRK-01" ? renderStory(UI.ibxStory, p) : p.code === "WRK-02" ? renderStory(UI.tplStory, p) : p.code === "TLS-01" ? toolStory(p) : `      <div class="read">
        ${todo(p.overview) ? "" : `<div><h3>${t("ovw")}</h3><p>${esc(tx(p.overview))}</p></div>`}
        ${points.length ? `<div><h3>${esc(tx(p.pointsTitle))}</h3><ol>${points.map(x => `<li><span>${esc(tx(x))}</span></li>`).join("")}</ol></div>` : ""}
        ${p.result ? `<div><h3>${t("result")}</h3><p>${esc(tx(p.result))}</p></div>` : ""}
        ${stack.length ? `<div><h3>${t("stack")}</h3><div class="tokens" style="margin:0">${stack.map(s => `<span>${esc(s)}</span>`).join("")}</div></div>` : ""}
      </div>`}
      <div class="pager"><button type="button" data-open="${slug(prev)}">← ${t("prev")}<b>${esc(tx(prev.name))}</b></button><button type="button" data-open="${slug(next)}">${t("next")} →<b>${esc(tx(next.name))}</b></button></div>
    </div></div>`;
  showFrame(frameNo);
  if (!sheet.open) sheet.showModal();
  if (!keep) sheet.scrollTop = 0;
}
function closeSheet() {
  sheet.querySelector("video")?.pause(); current = null;
  if (sheet.open) sheet.close();
  sheet.innerHTML = "";
}
sheet.addEventListener("close", () => { if (current) closeSheet(); });
sheet.addEventListener("click", e => {
  if (e.target === sheet || e.target.closest("[data-close]")) return closeSheet();
  const f = e.target.closest("[data-frame]"); if (f) return showFrame(+f.dataset.frame);
  const s = e.target.closest("[data-fstep]"); if (s) return showFrame(frameNo + +s.dataset.fstep);
});

/* ---------- clicks, language, hash ---------- */
const pageIndex = id => PAGES.findIndex(p => p.id === id);
document.addEventListener("click", e => {
  const o = e.target.closest("[data-open]");
  if (o) { const p = find(o.dataset.open); if (p) openSheet(p, false, +o.dataset.at || 0); return; }
  const g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); const i = pageIndex(g.dataset.go); if (i >= 0) goTo(i); return; }
  const gb = e.target.closest("[data-group]"); if (gb) { orb.group = +gb.dataset.group; buildOrbit(!calm.matches); return; }
  const tile = e.target.closest(".tile[data-item]"); if (tile) { const k = +tile.dataset.item; orb.pin = orb.pin === k ? null : k; showItem(k); return; }
  if (orb.pin != null && e.target.closest("#about") && !e.target.closest("#oinfo")) { orb.pin = null; showItem(null); }
  const l = e.target.closest("[data-lang]"); if (l) setLang(l.dataset.lang);
});
onLang(l => { lang = l; render(); });
addEventListener("hashchange", () => { const i = pageIndex(location.hash.slice(1)); if (i >= 0 && i !== idx) goTo(i); });
render();
{ const h = location.hash.slice(1), i = pageIndex(h), p = find(h); if (i > 0) goTo(i); else if (p) { goTo(pageIndex(p.category === "tools" ? "tool" : p.category)); openSheet(p); } }
</script>
